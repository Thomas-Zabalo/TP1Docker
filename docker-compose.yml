services:
  # Point d'entrée HTTP : distribue les requêtes vers le frontend ou l'API.
  nginx:
    build: ./nginx
    ports:
      - "${HTTP_PORT:-80}:80" # Seul port exposé vers l'extérieur (choix volontaire).
    networks:
      - app-network
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "${NGINX_CPUS:-0.25}"
          memory: "${NGINX_MEMORY:-128M}"

  # Sert les fichiers statiques générés par le build React.
  frontend:
    build: ./frontend
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPUS:-0.50}"
          memory: "${FRONTEND_MEMORY:-256M}"

  # API FastAPI et accès à la base SQLite.
  backend:
    build: ./backend
    networks:
      - app-network
    volumes:
      # Conserve la base sur l'hôte lors du remplacement du conteneur.
      - "${BACKEND_DATA_DIR:-./backend_data}:/app/data"
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPUS:-1.0}"
          memory: "${BACKEND_MEMORY:-512M}"

networks:
  app-network:
    driver: bridge