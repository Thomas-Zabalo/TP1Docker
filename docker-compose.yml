version: '3.8'

services:
  # Point d'entrée HTTP : distribue les requêtes vers le frontend ou l'API.
  nginx:
    build: ./nginx
    ports:
      - "80:80"          # Seul port exposé vers l'extérieur (choix volontaire).
    networks:
      - app-network
    depends_on:
      - frontend
      - backend

  # Sert les fichiers statiques générés par le build React.
  frontend:
    build: ./frontend
    networks:
      - app-network
    deploy:
      resources:
        limits:
          # Plafonds de ressources du conteneur frontend.
          cpus: '0.50'
          memory: 256M

  # API FastAPI et accès à la base SQLite.
  backend:
    build: ./backend
    networks:
      - app-network
    volumes:
      # Conserve la base sur l'hôte lors du remplacement du conteneur.
      - ./backend_data:/app/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  app-network:
    driver: bridge