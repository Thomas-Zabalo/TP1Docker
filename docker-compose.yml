version: '3.8'

services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - frontend
      - backend

  frontend:
    build: ./frontend
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  backend:
    build: ./backend
    networks:
      - app-network
    volumes:
      - ./backend_data:/app/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  app-network:
    driver: bridge